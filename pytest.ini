[pytest]
asyncio_mode = auto

# Koneksi Telethon dibuka sekali untuk seluruh sesi test (fixture `tg`).
# Tanpa dua baris di bawah, pytest-asyncio membuat event loop BARU untuk tiap
# test, sedangkan Telethon menolak dipakai dari loop yang berbeda:
#   RuntimeError: The asyncio event loop must not change after connection
# Jadi fixture DAN test harus berjalan di loop yang sama, yaitu loop sesi.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Test yang menembak bot sungguhan ditandai `kuota` dan TIDAK ikut jalan secara
# default. Tanpa ini, `pytest` polos langsung memotong kuota harian bot —
# pembatas paling mahal di sistem ini.
#
#   pytest                  -> hanya test offline (database/parser)
#   pytest -m kuota         -> hanya test yang menembak bot
#   pytest -m ""            -> semuanya
markers =
    kuota: menembak bot Telegram sungguhan dan memotong kuota harian
addopts = -m "not kuota"
