<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemantauan Command — Artemis</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #16181d; --dim: #6b7280;
    --line: #e3e6ea; --ok: #15803d; --ok-bg: #dcfce7;
    --down: #b91c1c; --down-bg: #fee2e2; --unknown: #6b7280; --unknown-bg: #eef0f3;
    --accent: #1e293b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --ink: #e7e9ee; --dim: #9aa3b2;
      --line: #262c35; --ok: #4ade80; --ok-bg: #14321f;
      --down: #f87171; --down-bg: #3a1717; --unknown: #9aa3b2; --unknown-bg: #22272f;
      --accent: #e7e9ee;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
           justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .card .l { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card.ok .n { color: var(--ok); }
  .card.down .n { color: var(--down); }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button, input { font: inherit; color: inherit; }
  button { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
           padding: 7px 13px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  input[type=password], input[type=text] { background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; padding: 7px 11px; min-width: 240px; }

  .tablewrap { background: var(--card); border: 1px solid var(--line);
               border-radius: 10px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 700px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); font-weight: 600; }
  tbody tr:last-child td { border-bottom: 0; }
  td.cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px;
          font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.down { background: var(--down-bg); color: var(--down); }
  .pill.unknown { background: var(--unknown-bg); color: var(--unknown); }
  .dim { color: var(--dim); }
  .msg { color: var(--dim); font-size: 12px; max-width: 320px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 40px; text-align: center; color: var(--dim); }
  .err { background: var(--down-bg); color: var(--down); padding: 10px 14px;
         border-radius: 8px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Pemantauan Command</h1>
      <div class="sub" id="sub">memuat…</div>
    </div>
    <div class="bar" style="margin:0">
      <input type="password" id="key" placeholder="X-API-Key" autocomplete="off">
      <button id="simpan">Simpan</button>
    </div>
  </header>

  <div id="err" class="err" hidden></div>

  <div class="cards">
    <div class="card"><div class="n" id="c-total">–</div><div class="l">Total command</div></div>
    <div class="card ok"><div class="n" id="c-ok">–</div><div class="l">Aktif</div></div>
    <div class="card down"><div class="n" id="c-down">–</div><div class="l">Bermasalah</div></div>
    <div class="card"><div class="n" id="c-unk">–</div><div class="l">Belum dicek</div></div>
  </div>

  <div class="bar">
    <button id="f-all" aria-pressed="true">Semua</button>
    <button id="f-down" aria-pressed="false">Bermasalah saja</button>
    <button id="f-unk" aria-pressed="false">Belum dicek</button>
    <button id="refresh" style="margin-left:auto">Muat ulang</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>Bot</th><th>Command</th><th>Kondisi</th><th>Status terakhir</th>
          <th>Gagal beruntun</th><th>Dicek</th><th>Pesan</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Tidak ada command pada filter ini.</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let data = [], filter = "all";

function getKey() {
  try { return localStorage.getItem("artemis_api_key") || ""; } catch { return ""; }
}
function setKey(v) {
  try { localStorage.setItem("artemis_api_key", v); } catch {}
}

function waktuRelatif(iso) {
  if (!iso) return "—";
  const d = new Date(iso), detik = (Date.now() - d.getTime()) / 1000;
  if (detik < 60) return "baru saja";
  if (detik < 3600) return `${Math.floor(detik / 60)} menit lalu`;
  if (detik < 86400) return `${Math.floor(detik / 3600)} jam lalu`;
  return `${Math.floor(detik / 86400)} hari lalu`;
}

function kondisi(r) {
  if (r.ok === true) return { cls: "ok", label: "Aktif" };
  if (r.ok === false) return { cls: "down", label: "Down" };
  return { cls: "unknown", label: "Belum dicek" };
}

function render() {
  const rows = data.filter((r) =>
    filter === "all" ? true :
    filter === "down" ? r.ok === false :
    r.ok === null || r.ok === undefined
  );

  $("rows").innerHTML = rows.map((r) => {
    const k = kondisi(r);
    return `<tr>
      <td class="dim">${r.bot}</td>
      <td class="cmd">${r.cmd}</td>
      <td><span class="pill ${k.cls}">${k.label}</span></td>
      <td class="dim">${r.last_status ?? "—"}</td>
      <td>${r.consecutive_failures > 0
            ? `<strong style="color:var(--down)">${r.consecutive_failures}×</strong>` : "—"}</td>
      <td class="dim">${waktuRelatif(r.last_checked_at)}</td>
      <td class="msg" title="${(r.last_msg ?? "").replace(/"/g, "&quot;")}">${r.last_msg ?? ""}</td>
    </tr>`;
  }).join("");

  $("empty").hidden = rows.length > 0;
}

async function muat() {
  const key = getKey();
  $("err").hidden = true;
  try {
    const res = await fetch("/health/commands", { headers: key ? { "X-API-Key": key } : {} });
    if (res.status === 401) throw new Error("API key belum diisi atau salah.");
    if (!res.ok) throw new Error(`Gagal memuat (HTTP ${res.status}).`);
    const j = await res.json();

    data = j.commands || [];
    $("c-total").textContent = j.total ?? 0;
    $("c-ok").textContent = j.sehat ?? 0;
    $("c-down").textContent = j.bermasalah ?? 0;
    $("c-unk").textContent = j.belum_dicek ?? 0;
    $("sub").textContent = `Diperbarui ${new Date().toLocaleTimeString("id-ID")} · muat ulang otomatis tiap 60 detik`;
    render();
  } catch (e) {
    $("err").textContent = e.message;
    $("err").hidden = false;
    $("sub").textContent = "gagal memuat";
  }
}

$("simpan").onclick = () => { setKey($("key").value.trim()); $("key").value = ""; muat(); };
$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("simpan").click(); });
$("refresh").onclick = muat;

for (const [id, val] of [["f-all", "all"], ["f-down", "down"], ["f-unk", "unknown"]]) {
  $(id).onclick = () => {
    filter = val;
    for (const o of ["f-all", "f-down", "f-unk"]) {
      $(o).setAttribute("aria-pressed", String(o === id));
    }
    render();
  };
}

muat();
setInterval(muat, 60000);
</script>
</body>
</html>
